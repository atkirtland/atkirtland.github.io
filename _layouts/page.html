<!doctype html>
<html>
  <head>
    {% include head.html %}
    {% if mathjax %}
    {% include mathjax.html %}
    {% endif %}
    <title>{{ title }}</title>
  </head>

  <body>
    <script>
      // Apply saved theme immediately to prevent flash (default to dark mode)
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.classList.remove('dark-mode');
      } else {
        document.body.classList.add('dark-mode');
      }
    </script>
    <header>
      {% if mathjax %}
      <div style="display: none">$ {% include mathjax.tex %} $</div>
      {% endif %}
      {% include menu.html %}
    </header>
    <article>
      <h1>{{ title }}</h1>
      {{ content }}
    </article>
    <footer>
      {% if comments %}{% include footer.html %}{% endif %}
    </footer>
  </body>
</html>
