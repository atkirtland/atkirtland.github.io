---
permalink: /blog/category-view.html
---

<h3>By Category</h3>
<ul>
{% for category in collections.categories %}
  <li>{{ category.name }}
    <ul>
{% for post in category.posts %}
      <li>
        <a href="{{ post.url }}">{{ post.data.title }}</a>
        <small>{{ post.date | date_to_string }}</small>
      </li>
{% endfor %}
    </ul>
  </li>
{% endfor %}
</ul>
