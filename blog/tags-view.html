permalink: /blog/tags-view.html
---

<h3>By Tags</h3>
<ul>
{% for tag in collections.tags %}
  <li>{{ tag.name }}
    <ul>
{% for post in tag.posts %}
      <li>
        <a href="{{ post.url }}">{{ post.data.title }}</a>
        <small>{{ post.date | date_to_string }}</small>
      </li>
{% endfor %}
    </ul>
  </li>
{% endfor %}
</ul>
